<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk STK Push Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
  <div class="container bg-white p-4 rounded shadow-sm" style="max-width: 800px;">
    <h2>Bulk STK Push Portal</h2>
    <p class="text-muted">Rate Limited to 9 Requests / Minute</p>
    <hr>
    <form id="stkForm">
      <div class="mb-3">
        <label class="form-label">Account Number</label>
        <input type="text" id="accountNumber" class="form-control" placeholder="25045" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Amount (KES)</label>
        <input type="number" id="amount" class="form-control" min="1" max="150000" placeholder="1000" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Phone Numbers (One per line)</label>
        <textarea id="phoneNumbers" class="form-control" rows="6" placeholder="254712345678&#10;254787654321" required></textarea>
      </div>
      <button type="submit" id="submitBtn" class="btn btn-primary w-100">Initiate Bulk Push</button>
    </form>

    <div id="progressSection" class="mt-4 d-none">
      <h5>Job Progress: <span id="statusBadge" class="badge bg-warning">PROCESSING</span></h5>
      <p id="counterText">Processed 0 of 0</p>
      
      <h6 class="mt-3">Execution Logs</h6>
      <div class="border rounded p-2 bg-dark text-light" style="max-height: 250px; overflow-y: auto;">
        <ul id="logList" class="list-unstyled mb-0 font-monospace small"></ul>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
